<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560"><title>SBRT visual grammar study</title><rect width="1600" height="1560" fill="#FAFAF6"/><g font-family="Noto Sans CJK KR, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#202823" stroke-width="1.4"/></marker></defs><text x="55" y="40" font-size="15" fill="#65716A">SBRT / VISUAL LANGUAGE STUDY V0.3 / RELATION STUDY</text><text x="55" y="92" font-size="38" fill="#202823">Show the exchange, not just the labels.</text><text x="55" y="125" font-size="17" fill="#65716A">관계는 요청·생성·피드백·판단의 구조로 읽습니다. / CONCEPT — 역할을 설명하는 예시이며 실제 대화 로그가 아닙니다.</text><path d="M55 150H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><circle cx="100" cy="211" r="21" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M93 231v12 M107 231v12 M93 243q-25 0 -29 15 h72 q-4 -15 -29 -15" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><text x="150" y="214" font-size="20" fill="#202823">DESIGNER</text><text x="150" y="245" font-size="16" fill="#65716A">사람 / 판단 주체</text><rect x="391" y="195" width="48" height="48" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><rect x="401" y="205" width="28" height="28" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M401 185v10 M401 243v10 M381 205h10 M439 205h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M415 185v10 M415 243v10 M381 219h10 M439 219h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M429 185v10 M429 243v10 M381 233h10 M439 233h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><text x="470" y="214" font-size="20" fill="#202823">AI</text><text x="470" y="245" font-size="16" fill="#65716A">칩 / 정보 처리의 은유</text><rect x="760" y="192" width="50" height="48" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M769 205h32 M769 215h32" fill="none" stroke="#65716A" stroke-width="1" stroke-dasharray=""/><text x="835" y="214" font-size="20" fill="#202823">WORK OBJECT</text><text x="835" y="245" font-size="16" fill="#65716A">제안·시안·작업 대상</text><path d="M1180 218H1270" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="1300" y="224" font-size="18" fill="#202823">전달의 방향</text><path d="M55 290H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="340" font-size="26" fill="#202823">01 / GENERATOR</text><text x="55" y="372" font-size="19" fill="#65716A">요청을 여러 대안으로 펼치는 구조</text><circle cx="135" cy="477" r="21" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M128 497v12 M142 497v12 M128 509q-25 0 -29 15 h72 q-4 -15 -29 -15" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><rect x="361" y="461" width="48" height="48" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><rect x="371" y="471" width="28" height="28" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M371 451v10 M371 509v10 M351 471h10 M409 471h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M385 451v10 M385 509v10 M351 485h10 M409 485h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M399 451v10 M399 509v10 M351 499h10 M409 499h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M167 470H347" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="202" y="448" font-size="17" fill="#202823">생성 요청</text><rect x="625" y="397" width="64" height="46" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M634 410h46 M634 420h46" fill="none" stroke="#65716A" stroke-width="1" stroke-dasharray=""/><path d="M419 485H515V420H618" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><rect x="625" y="462" width="64" height="46" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M634 475h46 M634 485h46" fill="none" stroke="#65716A" stroke-width="1" stroke-dasharray=""/><path d="M419 485H515V485H618" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><rect x="625" y="527" width="64" height="46" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M634 540h46 M634 550h46" fill="none" stroke="#65716A" stroke-width="1" stroke-dasharray=""/><path d="M419 485H515V550H618" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="620" y="393" font-size="17" fill="#202823">여러 대안</text><text x="75" y="586" font-size="18" fill="#202823">GENERATE → OPTIONS</text><text x="75" y="621" font-size="16" fill="#65716A">분기 = 대안의 생성. 가지 수는 실제 생성량이 아닙니다.</text><text x="855" y="340" font-size="26" fill="#202823">02 / ASSISTANT</text><text x="855" y="372" font-size="19" fill="#65716A">디자이너가 정한 작업의 일부를 수행하는 구조</text><circle cx="920" cy="477" r="21" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M913 497v12 M927 497v12 M913 509q-25 0 -29 15 h72 q-4 -15 -29 -15" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><rect x="1105" y="450" width="105" height="70" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1114 463h87 M1114 473h87" fill="none" stroke="#65716A" stroke-width="1" stroke-dasharray=""/><rect x="1366" y="461" width="48" height="48" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><rect x="1376" y="471" width="28" height="28" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1376 451v10 M1376 509v10 M1356 471h10 M1414 471h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M1390 451v10 M1390 509v10 M1356 485h10 M1414 485h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M1404 451v10 M1404 509v10 M1356 499h10 M1414 499h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M952 470H1098" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="968" y="448" font-size="17" fill="#202823">범위 설정</text><path d="M1217 470H1349" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="1234" y="448" font-size="17" fill="#202823">부분 작업</text><path d="M1390 521V553H920V528" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="1077" y="580" font-size="17" fill="#202823">작업 결과를 받아 통합</text><text x="875" y="621" font-size="16" fill="#65716A">위임 범위와 결과의 귀환을 함께 표시합니다.</text><path d="M800 320V1055" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><path d="M55 665H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="715" font-size="26" fill="#202823">03 / ADVISOR</text><text x="55" y="747" font-size="19" fill="#65716A">이미 있는 안을 검토하고 피드백하는 구조</text><circle cx="135" cy="852" r="21" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M128 872v12 M142 872v12 M128 884q-25 0 -29 15 h72 q-4 -15 -29 -15" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><rect x="325" y="831" width="85" height="60" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M334 844h67 M334 854h67" fill="none" stroke="#65716A" stroke-width="1" stroke-dasharray=""/><rect x="601" y="836" width="48" height="48" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><rect x="611" y="846" width="28" height="28" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M611 826v10 M611 884v10 M591 846h10 M649 846h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M625 826v10 M625 884v10 M591 860h10 M649 860h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M639 826v10 M639 884v10 M591 874h10 M649 874h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M167 845H318" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="194" y="823" font-size="17" fill="#202823">내 안</text><path d="M417 845H584" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="438" y="823" font-size="17" fill="#202823">검토 요청</text><path d="M625 898V927H135V905" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="327" y="955" font-size="17" fill="#202823">피드백 → 수용·수정 판단</text><text x="75" y="996" font-size="16" fill="#65716A">검토할 안과 피드백의 귀환이 관계의 중심입니다.</text><text x="855" y="715" font-size="26" fill="#202823">04 / CO-CREATOR</text><text x="855" y="747" font-size="19" fill="#65716A">공유된 안을 서로의 제안으로 발전시키는 구조</text><circle cx="920" cy="852" r="21" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M913 872v12 M927 872v12 M913 884q-25 0 -29 15 h72 q-4 -15 -29 -15" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><rect x="1140" y="831" width="85" height="60" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1149 844h67 M1149 854h67" fill="none" stroke="#65716A" stroke-width="1" stroke-dasharray=""/><rect x="1401" y="836" width="48" height="48" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><rect x="1411" y="846" width="28" height="28" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1411 826v10 M1411 884v10 M1391 846h10 M1449 846h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M1425 826v10 M1425 884v10 M1391 860h10 M1449 860h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M1439 826v10 M1439 884v10 M1391 874h10 M1449 874h10" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><path d="M952 845H1133" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><path d="M1232 845H1384" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="1004" y="822" font-size="17" fill="#202823">제안</text><text x="1269" y="822" font-size="17" fill="#202823">재해석</text><path d="M1425 898V926H1183V899" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><path d="M1140 875H965" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="1012" y="905" font-size="16" fill="#202823">재검토</text><text x="1246" y="955" font-size="17" fill="#202823">변형 제안</text><text x="875" y="996" font-size="16" fill="#65716A">공유된 작업 대상과 반복 경로를 함께 드러냅니다.</text><path d="M55 1050H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="1098" font-size="25" fill="#202823">DESIGNER ROLES / 사람이 무엇을 하는지도 관계 구조로 구분합니다.</text><text x="55" y="1146" font-size="22" fill="#202823">EVALUATOR</text><text x="55" y="1177" font-size="18" fill="#65716A">기준에 따라 선택</text><circle cx="225" cy="1241" r="21" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M218 1261v12 M232 1261v12 M218 1273q-25 0 -29 15 h72 q-4 -15 -29 -15" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><rect x="70" y="1205" width="30" height="18" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M100 1214H140V1249H186" fill="none" stroke="#65716A" stroke-width="1.6" stroke-dasharray=""/><rect x="70" y="1240" width="30" height="18" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M100 1249H140V1249H186" fill="none" stroke="#65716A" stroke-width="1.6" stroke-dasharray=""/><rect x="70" y="1275" width="30" height="18" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M100 1284H140V1249H186" fill="none" stroke="#65716A" stroke-width="1.6" stroke-dasharray=""/><path d="M263 1249H330" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><rect x="340" y="1235" width="28" height="28" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M344 1249l7 7 12 -16" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="1357" font-size="18" fill="#202823">선택과 제외의 근거</text><text x="435" y="1146" font-size="22" fill="#202823">INTERPRETER</text><text x="435" y="1177" font-size="18" fill="#65716A">맥락에 비추어 해석</text><circle cx="605" cy="1241" r="21" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M598 1261v12 M612 1261v12 M598 1273q-25 0 -29 15 h72 q-4 -15 -29 -15" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><rect x="447" y="1228" width="40" height="42" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M456 1241h22 M456 1251h22" fill="none" stroke="#65716A" stroke-width="1" stroke-dasharray=""/><path d="M495 1249H566" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><path d="M643 1249H715" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="718" y="1256" font-size="17" fill="#202823">의미</text><path d="M540 1198H665" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="561" y="1193" font-size="15" fill="#65716A">맥락</text><text x="435" y="1357" font-size="18" fill="#202823">의미의 재구성과 설명</text><text x="815" y="1146" font-size="22" fill="#202823">ORCHESTRATOR</text><text x="815" y="1177" font-size="18" fill="#65716A">작업과 자원을 조율</text><circle cx="985" cy="1241" r="21" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M978 1261v12 M992 1261v12 M978 1273q-25 0 -29 15 h72 q-4 -15 -29 -15" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><rect x="1100" y="1201" width="30" height="20" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1023 1249H1065V1211H1093" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><rect x="1100" y="1242" width="30" height="20" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1023 1249H1065V1252H1093" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><rect x="1100" y="1283" width="30" height="20" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1023 1249H1065V1293H1093" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="825" y="1256" font-size="17" fill="#202823">흐름</text><path d="M877 1249H946" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><text x="815" y="1357" font-size="18" fill="#202823">연결과 순서의 조정</text><text x="1195" y="1146" font-size="22" fill="#202823">VALUE-CREATOR</text><text x="1195" y="1177" font-size="18" fill="#65716A">지향할 가치를 설정</text><circle cx="1365" cy="1241" r="21" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M1358 1261v12 M1372 1261v12 M1358 1273q-25 0 -29 15 h72 q-4 -15 -29 -15" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><text x="1209" y="1238" font-size="17" fill="#202823">목적</text><text x="1209" y="1267" font-size="17" fill="#202823">가치</text><path d="M1257 1249H1326" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><path d="M1403 1249H1475" fill="none" stroke="#202823" stroke-width="1.7" marker-end="url(#arr)"/><rect x="1480" y="1230" width="36" height="38" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="1444" y="1305" font-size="15" fill="#65716A">판단 기준</text><text x="1195" y="1357" font-size="18" fill="#202823">가치의 정의와 반영</text><path d="M55 1400H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="1445" font-size="18" fill="#202823">READING RULE / 역할은 고정된 통신 프로토콜이 아닙니다. 실제 작업에서는 여러 작용이 겹칠 수 있습니다.</text><text x="55" y="1480" font-size="17" fill="#65716A">AI 네 역할과 디자이너 네 역할을 일대일로 짝지은 표가 아닙니다. 위는 AI 기여, 아래는 디자이너 작용을 각각 설명합니다.</text><text x="55" y="1515" font-size="17" fill="#65716A">이 도판에는 분야색을 부여하지 않았습니다. 실제 분야 모듈에서는 A–D 표식과 일부 경계에만 색을 적용합니다.</text></g></svg>