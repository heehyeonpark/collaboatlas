<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400"><title>SBRT visual grammar study</title><rect width="1600" height="1400" fill="#FAFAF6"/><g font-family="Noto Sans CJK KR, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#202823" stroke-width="1.4"/></marker></defs><text x="55" y="40" font-size="15" fill="#65716A">SBRT / VISUAL LANGUAGE STUDY V0.3 / SYMBOL ANATOMY</text><text x="55" y="92" font-size="38" fill="#202823">What each mark is trying to say.</text><text x="55" y="125" font-size="17" fill="#65716A">기존 기호의 설계 의도와 읽기의 한계 / 연구에서 확정된 기호 체계가 아니라 제안된 시각 은유입니다.</text><path d="M55 150H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><rect x="63" y="241" width="84" height="84" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><circle cx="97" cy="283" r="14" stroke="#B9472D" fill="none" stroke-width="1.6"/><path d="M115 259h18 v48 h-18 M111 283h22" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="66" y="233" font-size="18" fill="#B9472D">A</text><text x="175" y="240" font-size="24" fill="#B9472D">SIGN &amp; MEANING</text><text x="175" y="274" font-size="20" fill="#202823">A / 기호와 의미</text><text x="175" y="315" font-size="18" fill="#202823">원: 표현된 기호나 메시지</text><text x="175" y="344" font-size="18" fill="#202823">꺾쇠: 해석의 범위를 뜻하도록 의도</text><text x="175" y="373" font-size="18" fill="#202823">선: 기호와 의미 맥락의 대응</text><text x="55" y="432" font-size="16" fill="#65716A">문제: 꺾쇠만으로 “의미”를 읽기 어렵습니다.</text><text x="55" y="460" font-size="16" fill="#65716A">기호 → 해석 맥락의 확대도로 보완할 필요가 있습니다.</text><rect x="863" y="241" width="84" height="84" rx="0" fill="none" stroke="#286B9A" stroke-width="1.5"/><path d="M881 265l32 -8 20 15 v33 l-32 9 -20 -16Z M881 265l20 16 32 -9 M901 281v33" fill="none" stroke="#286B9A" stroke-width="1.6" stroke-dasharray=""/><text x="866" y="233" font-size="18" fill="#286B9A">B</text><text x="975" y="240" font-size="24" fill="#286B9A">ARTIFACT &amp; MATERIAL</text><text x="975" y="274" font-size="20" fill="#202823">B / 사물과 물성</text><text x="975" y="315" font-size="18" fill="#202823">면: 물리적 표면</text><text x="975" y="344" font-size="18" fill="#202823">부피: 입체적 형상</text><text x="975" y="373" font-size="18" fill="#202823">모서리: 형태와 물성의 경계</text><text x="855" y="432" font-size="16" fill="#65716A">물리적 인공물의 은유이며 모든 대상이 상자는 아닙니다.</text><text x="855" y="460" font-size="16" fill="#65716A">패션·텍스타일의 유연성은 추가 설명이 필요합니다.</text><rect x="63" y="536" width="84" height="84" rx="0" fill="none" stroke="#34735C" stroke-width="1.5"/><path d="M78 558H132V598H78 M92 570l-12 8 12 8 M118 570l12 8 -12 8" fill="none" stroke="#34735C" stroke-width="1.6" stroke-dasharray=""/><text x="66" y="528" font-size="18" fill="#34735C">C</text><text x="175" y="535" font-size="24" fill="#34735C">ACTION &amp; INTERACTION</text><text x="175" y="569" font-size="20" fill="#202823">C / 행동과 상호작용</text><text x="175" y="610" font-size="18" fill="#202823">열린 경계: 환경이나 인터페이스</text><text x="175" y="639" font-size="18" fill="#202823">두 방향 표식: 작용과 응답</text><text x="175" y="668" font-size="18" fill="#202823">사이 공간: 상호작용이 발생하는 지점</text><text x="55" y="727" font-size="16" fill="#65716A">문제: 부호가 코딩 기호처럼 보일 수 있습니다.</text><text x="55" y="755" font-size="16" fill="#65716A">명확한 왕복 화살표로 정교화하는 편이 좋습니다.</text><rect x="863" y="536" width="84" height="84" rx="0" fill="none" stroke="#77568D" stroke-width="1.5"/><path d="M882 555H928V601H882Z" fill="none" stroke="#77568D" stroke-width="1.6" stroke-dasharray=""/><rect x="877" y="550" width="10" height="10" rx="0" fill="#FAFAF6" stroke="#77568D" stroke-width="1.5"/><rect x="923" y="550" width="10" height="10" rx="0" fill="#FAFAF6" stroke="#77568D" stroke-width="1.5"/><rect x="877" y="596" width="10" height="10" rx="0" fill="#FAFAF6" stroke="#77568D" stroke-width="1.5"/><rect x="923" y="596" width="10" height="10" rx="0" fill="#FAFAF6" stroke="#77568D" stroke-width="1.5"/><text x="866" y="528" font-size="18" fill="#77568D">D</text><text x="975" y="535" font-size="24" fill="#77568D">SYSTEM &amp; SERVICE</text><text x="975" y="569" font-size="20" fill="#202823">D / 시스템과 서비스</text><text x="975" y="610" font-size="18" fill="#202823">노드: 시스템을 구성하는 요소</text><text x="975" y="639" font-size="18" fill="#202823">연결선: 요소 사이의 관계</text><text x="975" y="668" font-size="18" fill="#202823">전체 구조: 연결된 서비스나 시스템</text><text x="855" y="727" font-size="16" fill="#65716A">노드 네 개는 이해관계자 네 명을 뜻하지 않습니다.</text><text x="855" y="755" font-size="16" fill="#65716A">분야 식별용 구조와 실제 데이터 네트워크는 구분합니다.</text><path d="M55 795H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="842" font-size="26" fill="#202823">STAGES / 단계 기호는 활동의 은유입니다.</text><circle cx="115" cy="928" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M67 928H163 M115 880V976" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><circle cx="115" cy="928" r="25" stroke="#202823" fill="none" stroke-width="1.6"/><circle cx="115" cy="928" r="8" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M81 894L149 962 M81 962L149 894" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="97" cy="910" r="3" stroke="#202823" fill="#202823" stroke-width="1.6"/><text x="181" y="916" font-size="21" fill="#202823">DEFINE</text><text x="181" y="950" font-size="18" fill="#65716A">문제정의</text><text x="55" y="1021" font-size="17" fill="#202823">교차선과 중심: 초점 설정</text><text x="55" y="1051" font-size="17" fill="#202823">동심원: 맥락과 문제의 범위</text><circle cx="495" cy="928" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M447 928H543 M495 880V976" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><path d="M495 928L527.0 928.0" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="527.0" cy="928.0" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M495 928L519.5134221798073 948.5692035099693" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="519.5134221798073" cy="948.5692035099693" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M495 928L500.55674168534176 959.5138480963907" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="500.55674168534176" cy="959.5138480963907" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M495 928L479.0 955.712812921102" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="479.0" cy="955.712812921102" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M495 928L464.9298361348509 938.9446445864214" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="464.9298361348509" cy="938.9446445864214" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M495 928L464.9298361348509 917.0553554135786" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="464.9298361348509" cy="917.0553554135786" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M495 928L479.0 900.287187078898" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="479.0" cy="900.287187078898" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M495 928L500.55674168534176 896.4861519036093" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="500.55674168534176" cy="896.4861519036093" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M495 928L519.5134221798073 907.4307964900307" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="519.5134221798073" cy="907.4307964900307" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><circle cx="495" cy="928" r="9" stroke="#202823" fill="#202823" stroke-width="1.6"/><text x="561" y="916" font-size="21" fill="#202823">IDEATE</text><text x="561" y="950" font-size="18" fill="#65716A">아이데이션</text><text x="435" y="1021" font-size="17" fill="#202823">방사 구조: 대안의 확장</text><text x="435" y="1051" font-size="17" fill="#202823">중심과 말단: 출발점과 가능성</text><circle cx="875" cy="928" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M827 928H923 M875 880V976" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><path d="M875 898L905 928 875 958 845 928Z M852 921H898 M852 935H898 M875 898V958" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="875" cy="928" r="9" stroke="#202823" fill="none" stroke-width="1.6"/><text x="941" y="916" font-size="21" fill="#202823">EVALUATE</text><text x="941" y="950" font-size="18" fill="#65716A">평가와 수렴</text><text x="815" y="1021" font-size="17" fill="#202823">외곽과 내부 구획: 비교와 선별</text><text x="815" y="1051" font-size="17" fill="#202823">중심: 판단의 초점</text><circle cx="1255" cy="928" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M1207 928H1303 M1255 880V976" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><rect x="1229" y="902" width="52" height="52" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><rect x="1237" y="910" width="36" height="36" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1245 928l8 8 16 -20" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><text x="1321" y="916" font-size="21" fill="#202823">DELIVER</text><text x="1321" y="950" font-size="18" fill="#65716A">최종산출</text><text x="1195" y="1021" font-size="17" fill="#202823">겹친 프레임: 결과의 구체화</text><text x="1195" y="1051" font-size="17" fill="#202823">체크: 완료 상태의 은유</text><text x="55" y="1122" font-size="18" fill="#65716A">점·가지·프레임의 수와 크기는 통계값이 아닙니다. Evaluate의 마름모는 분야 D를 뜻하지 않습니다.</text><path d="M55 1160H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="1208" font-size="25" fill="#202823">KEEP THE LEVELS SEPARATE / 분야, 단계, 주체, 역할, 관계를 구별합니다.</text><text x="55" y="1255" font-size="20" fill="#202823">분야 표식 = 무엇을 다루는가 / 단계 기호 = 어떤 활동인가 / 사람·칩 = 누가 참여하는가</text><text x="55" y="1293" font-size="20" fill="#202823">역할의 작용 = 무엇을 하는가 / 화살표와 작업 대상 = 무엇이 누구에게 전달되고 어떻게 바뀌는가</text><text x="55" y="1354" font-size="17" fill="#65716A">범례의 사각 테두리는 기호의 표시 범위이며 실제 시스템 경계가 아닙니다. 선과 주석에 의미를 부여해 밀도를 만듭니다.</text></g></svg>