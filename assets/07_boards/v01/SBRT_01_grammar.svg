<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280"><title>SBRT visual grammar study</title><rect width="1600" height="1280" fill="#FAFAF6"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="55" y="40" font-size="15" fill="#65716A">SBRT / VISUAL LANGUAGE STUDY 01</text><text x="55" y="92" font-size="38" fill="#202823">A grammar of collaboration</text><text x="55" y="125" font-size="17" fill="#65716A">협업을 읽는 시각 문법 / 모든 기호는 제안이며, 통계적 크기나 위계를 나타내지 않습니다.</text><path d="M55 150H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="191" font-size="22" fill="#202823">FIELD / 디자인 문제의 범위</text><g id="field-A"><rect x="63" y="243" width="84" height="84" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><circle cx="97" cy="285" r="14" stroke="#B9472D" fill="none" stroke-width="1.6"/><path d="M115 261h18 v48 h-18 M111 285h22" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="66" y="235" font-size="18" fill="#B9472D">A</text><text x="167" y="262" font-size="18" fill="#B9472D">SIGN &amp; MEANING</text><text x="167" y="292" font-size="19" fill="#202823">기호와 의미</text><text x="55" y="365" font-size="16" fill="#65716A">시각 / 정보 / 브랜딩 / 디지털미디어</text></g><g id="field-B"><rect x="443" y="243" width="84" height="84" rx="0" fill="none" stroke="#286B9A" stroke-width="1.5"/><path d="M461 267l32 -8 20 15 v33 l-32 9 -20 -16Z M461 267l20 16 32 -9 M481 283v33" fill="none" stroke="#286B9A" stroke-width="1.6" stroke-dasharray=""/><text x="446" y="235" font-size="18" fill="#286B9A">B</text><text x="547" y="262" font-size="18" fill="#286B9A">ARTIFACT &amp; MATERIAL</text><text x="547" y="292" font-size="19" fill="#202823">사물과 물성</text><text x="435" y="365" font-size="16" fill="#65716A">제품 / 패션 / 텍스타일 / 산업공예</text></g><g id="field-C"><rect x="823" y="243" width="84" height="84" rx="0" fill="none" stroke="#34735C" stroke-width="1.5"/><path d="M838 265H892V305H838 M852 277l-12 8 12 8 M878 277l12 8 -12 8" fill="none" stroke="#34735C" stroke-width="1.6" stroke-dasharray=""/><text x="826" y="235" font-size="18" fill="#34735C">C</text><text x="927" y="262" font-size="18" fill="#34735C">ACTION &amp; INTERACTION</text><text x="927" y="292" font-size="19" fill="#202823">행동과 상호작용</text><text x="815" y="365" font-size="16" fill="#65716A">UI·UX / 인터랙션 / 공간환경</text></g><g id="field-D"><rect x="1203" y="243" width="84" height="84" rx="0" fill="none" stroke="#77568D" stroke-width="1.5"/><path d="M1222 262H1268V308H1222Z" fill="none" stroke="#77568D" stroke-width="1.6" stroke-dasharray=""/><rect x="1217" y="257" width="10" height="10" rx="0" fill="#FAFAF6" stroke="#77568D" stroke-width="1.5"/><rect x="1263" y="257" width="10" height="10" rx="0" fill="#FAFAF6" stroke="#77568D" stroke-width="1.5"/><rect x="1217" y="303" width="10" height="10" rx="0" fill="#FAFAF6" stroke="#77568D" stroke-width="1.5"/><rect x="1263" y="303" width="10" height="10" rx="0" fill="#FAFAF6" stroke="#77568D" stroke-width="1.5"/><text x="1206" y="235" font-size="18" fill="#77568D">D</text><text x="1307" y="262" font-size="18" fill="#77568D">SYSTEM &amp; SERVICE</text><text x="1307" y="292" font-size="19" fill="#202823">시스템과 서비스</text><text x="1195" y="365" font-size="16" fill="#65716A">서비스 / 경험 / 융합 / 전략</text></g><text x="55" y="404" font-size="17" fill="#65716A">같은 프레임 안에서 의미를 다루는 방식만 변화합니다. 내부 구조는 개념 표식이며 요소 수·복잡성 점수가 아닙니다.</text><path d="M55 433H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="475" font-size="22" fill="#202823">STAGE / 기존 4단계 기호 유지</text><g id="stage-1"><circle cx="110" cy="551" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M62 551H158 M110 503V599" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><circle cx="110" cy="551" r="25" stroke="#202823" fill="none" stroke-width="1.6"/><circle cx="110" cy="551" r="8" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M76 517L144 585 M76 585L144 517" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="92" cy="533" r="3" stroke="#202823" fill="#202823" stroke-width="1.6"/><text x="183" y="538" font-size="22" fill="#202823">01 / DEFINE</text><text x="183" y="570" font-size="18" fill="#65716A">문제정의</text></g><g id="stage-2"><circle cx="490" cy="551" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M442 551H538 M490 503V599" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><path d="M490 551L522.0 551.0" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="522.0" cy="551.0" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M490 551L514.5134221798073 571.5692035099693" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="514.5134221798073" cy="571.5692035099693" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M490 551L495.55674168534176 582.5138480963907" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="495.55674168534176" cy="582.5138480963907" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M490 551L474.0 578.712812921102" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="474.0" cy="578.712812921102" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M490 551L459.9298361348509 561.9446445864214" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="459.9298361348509" cy="561.9446445864214" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M490 551L459.9298361348509 540.0553554135786" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="459.9298361348509" cy="540.0553554135786" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M490 551L474.0 523.287187078898" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="474.0" cy="523.287187078898" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M490 551L495.55674168534176 519.4861519036093" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="495.55674168534176" cy="519.4861519036093" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M490 551L514.5134221798073 530.4307964900307" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="514.5134221798073" cy="530.4307964900307" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><circle cx="490" cy="551" r="9" stroke="#202823" fill="#202823" stroke-width="1.6"/><text x="563" y="538" font-size="22" fill="#202823">02 / IDEATE</text><text x="563" y="570" font-size="18" fill="#65716A">아이데이션</text></g><g id="stage-3"><circle cx="870" cy="551" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M822 551H918 M870 503V599" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><path d="M870 521L900 551 870 581 840 551Z M847 544H893 M847 558H893 M870 521V581" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="870" cy="551" r="9" stroke="#202823" fill="none" stroke-width="1.6"/><text x="943" y="538" font-size="22" fill="#202823">03 / EVALUATE</text><text x="943" y="570" font-size="18" fill="#65716A">평가와 수렴</text></g><g id="stage-4"><circle cx="1250" cy="551" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M1202 551H1298 M1250 503V599" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><rect x="1224" y="525" width="52" height="52" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><rect x="1232" y="533" width="36" height="36" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1240 551l8 8 16 -20" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><text x="1323" y="538" font-size="22" fill="#202823">04 / DELIVER</text><text x="1323" y="570" font-size="18" fill="#65716A">최종산출</text></g><path d="M55 625H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="667" font-size="22" fill="#202823">ACTOR + ROLE / 외곽은 주체, 내부는 교체되는 역할</text><g id="role-Ge"><rect x="64" y="711" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="77" y="749" font-size="21" fill="#202823">Ge</text><text x="150" y="737" font-size="23" fill="#202823">Generator</text><text x="150" y="767" font-size="17" fill="#65716A">AI / 생성자</text></g><g id="role-As"><rect x="444" y="711" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="457" y="749" font-size="21" fill="#202823">As</text><text x="530" y="737" font-size="23" fill="#202823">Assistant</text><text x="530" y="767" font-size="17" fill="#65716A">AI / 조력자</text></g><g id="role-Ad"><rect x="824" y="711" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="837" y="749" font-size="21" fill="#202823">Ad</text><text x="910" y="737" font-size="23" fill="#202823">Advisor</text><text x="910" y="767" font-size="17" fill="#65716A">AI / 조언자</text></g><g id="role-Co"><rect x="1204" y="711" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="1217" y="749" font-size="21" fill="#202823">Co</text><text x="1290" y="737" font-size="23" fill="#202823">Co-creator</text><text x="1290" y="767" font-size="17" fill="#65716A">AI / 공동창작자</text></g><g id="role-E"><circle cx="95" cy="857" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="77" y="864" font-size="21" fill="#202823">E</text><text x="150" y="852" font-size="23" fill="#202823">Evaluator</text><text x="150" y="882" font-size="17" fill="#65716A">DESIGNER / 평가자</text></g><g id="role-I"><circle cx="475" cy="857" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="457" y="864" font-size="21" fill="#202823">I</text><text x="530" y="852" font-size="23" fill="#202823">Interpreter</text><text x="530" y="882" font-size="17" fill="#65716A">DESIGNER / 해석자</text></g><g id="role-O"><circle cx="855" cy="857" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="837" y="864" font-size="21" fill="#202823">O</text><text x="910" y="852" font-size="23" fill="#202823">Orchestrator</text><text x="910" y="882" font-size="17" fill="#65716A">DESIGNER / 조율자</text></g><g id="role-V"><circle cx="1235" cy="857" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="1217" y="864" font-size="21" fill="#202823">V</text><text x="1290" y="852" font-size="23" fill="#202823">Value-creator</text><text x="1290" y="882" font-size="17" fill="#65716A">DESIGNER / 가치창출자</text></g><text x="55" y="946" font-size="17" fill="#65716A">크기는 동일한 표시 규격입니다. 역할은 한 단계에 고정되지 않으며, 원과 사각형의 차이는 우열을 뜻하지 않습니다.</text><path d="M55 974H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="1017" font-size="22" fill="#202823">RELATION / 한 가지 시각 속성에 한 가지 의미</text><path d="M70 1065H220" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="250" y="1072" font-size="18" fill="#202823">역할 쌍의 연결: 같은 참여자, 같은 단계의 응답</text><path d="M70 1110H220" fill="none" stroke="#202823" stroke-width="1.5" stroke-dasharray="7 5"/><text x="250" y="1117" font-size="18" fill="#202823">주석 연결: 설명 대상과 주석을 연결</text><rect x="860" y="1045" width="110" height="34" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="875" y="1069" font-size="15" fill="#202823">ACTUAL</text><text x="995" y="1069" font-size="18" fill="#202823">실제 / 보고된 협업</text><rect x="860" y="1095" width="110" height="34" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="885" y="1119" font-size="15" fill="#202823">IDEAL</text><text x="995" y="1119" font-size="18" fill="#202823">이상 / 바라는 협업</text><text x="55" y="1187" font-size="18" fill="#202823">색 = 분야  |  좌→우 = 단계 순서  |  크기·굵기 = 고정  |  참여자 = ID  |  실제·이상 = 분리된 동일 형식 패널</text><text x="55" y="1232" font-size="16" fill="#65716A">FIELD의 영문 제목은 전시용 제안 명칭입니다. 논문의 공식 명칭과 분야 경계는 최신본 확인 후 확정합니다.</text></g></svg>