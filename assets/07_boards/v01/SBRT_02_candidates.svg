<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><title>SBRT visual grammar study</title><rect width="1600" height="1060" fill="#FAFAF6"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="55" y="40" font-size="15" fill="#65716A">SBRT / VISUAL LANGUAGE STUDY 02</text><text x="55" y="92" font-size="38" fill="#202823">Three ways to read one relationship</text><text x="55" y="125" font-size="17" fill="#65716A">동일 응답 비교 / A-P1, Define, Actual: AI Assistant + Designer Value-creator / source: chips.json</text><path d="M55 150H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="200" font-size="23" fill="#202823">01 / PAIRED MODULES</text><text x="55" y="234" font-size="17" fill="#65716A">쌍 모듈: 두 주체와 역할을 빠르게 구분</text><rect x="55" y="263" width="470" height="420" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="73" y="293" width="84" height="84" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><circle cx="107" cy="335" r="14" stroke="#B9472D" fill="none" stroke-width="1.6"/><path d="M125 311h18 v48 h-18 M121 335h22" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="76" y="285" font-size="18" fill="#B9472D">A</text><circle cx="405" cy="335" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M357 335H453 M405 287V383" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><circle cx="405" cy="335" r="25" stroke="#202823" fill="none" stroke-width="1.6"/><circle cx="405" cy="335" r="8" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M371 301L439 369 M371 369L439 301" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="387" cy="317" r="3" stroke="#202823" fill="#202823" stroke-width="1.6"/><text x="85" y="428" font-size="16" fill="#B9472D">A-P1 / ACTUAL</text><rect x="129" y="474" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="142" y="512" font-size="21" fill="#202823">As</text><circle cx="400" cy="505" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="382" y="512" font-size="21" fill="#202823">V</text><path d="M191 505H369" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="111" y="570" font-size="18" fill="#202823">AI / Assistant</text><text x="315" y="570" font-size="18" fill="#202823">D / Value-creator</text><text x="85" y="640" font-size="17" fill="#65716A">주체가 유지되고, 내부 역할이 바뀝니다.</text><text x="55" y="730" font-size="18" fill="#202823">전시의 기본 단위로 추천합니다.</text><text x="55" y="764" font-size="18" fill="#202823">외곽 형태와 역할을 독립적으로 읽습니다.</text><text x="55" y="798" font-size="18" fill="#202823">실제와 이상을 나란히 비교하기 쉽습니다.</text><text x="565" y="200" font-size="23" fill="#202823">02 / COLLABORATION FRAME</text><text x="565" y="234" font-size="17" fill="#65716A">협업 프레임: 한 단계의 관계를 하나로 묶기</text><rect x="565" y="263" width="470" height="420" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="625" y="298" width="350" height="340" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><circle cx="800" cy="359" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M752 359H848 M800 311V407" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><circle cx="800" cy="359" r="25" stroke="#202823" fill="none" stroke-width="1.6"/><circle cx="800" cy="359" r="8" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M766 325L834 393 M766 393L834 325" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="782" cy="341" r="3" stroke="#202823" fill="#202823" stroke-width="1.6"/><text x="649" y="432" font-size="16" fill="#B9472D">A-P1 / ACTUAL</text><rect x="675" y="479" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="688" y="517" font-size="21" fill="#202823">As</text><circle cx="894" cy="510" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="876" y="517" font-size="21" fill="#202823">V</text><path d="M737 510H863" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="655" y="593" font-size="20" fill="#202823">DEFINE / 문제정의</text><text x="565" y="730" font-size="18" fill="#202823">단계 상세 화면의 확대도로 적합합니다.</text><text x="565" y="764" font-size="18" fill="#202823">분야, 단계, 역할을 한 덩어리로 묶습니다.</text><text x="565" y="798" font-size="18" fill="#202823">축소하면 정보가 밀집될 수 있습니다.</text><text x="1075" y="200" font-size="23" fill="#202823">03 / ROLE MATRIX</text><text x="1075" y="234" font-size="17" fill="#65716A">역할 매트릭스: 16개 조합에서 위치 확인</text><rect x="1075" y="263" width="470" height="420" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="1177" y="635" font-size="17" fill="#202823">Ge</text><text x="1255" y="635" font-size="17" fill="#202823">As</text><text x="1333" y="635" font-size="17" fill="#202823">Ad</text><text x="1411" y="635" font-size="17" fill="#202823">Co</text><text x="1117" y="347" font-size="17" fill="#202823">V</text><rect x="1153" y="300" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1231" y="300" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1309" y="300" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1387" y="300" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="1117" y="425" font-size="17" fill="#202823">O</text><rect x="1153" y="378" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1231" y="378" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1309" y="378" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1387" y="378" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="1117" y="503" font-size="17" fill="#202823">I</text><rect x="1153" y="456" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1231" y="456" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1309" y="456" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1387" y="456" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="1117" y="581" font-size="17" fill="#202823">E</text><rect x="1153" y="534" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1231" y="534" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1309" y="534" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><rect x="1387" y="534" width="78" height="78" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><circle cx="1270" cy="339" r="13" stroke="#B9472D" fill="#B9472D" stroke-width="1.6"/><text x="1292" y="333" font-size="15" fill="#B9472D">A-P1</text><text x="1105" y="657" font-size="16" fill="#65716A">행·열은 역할 범주입니다. 높낮이가 아닙니다.</text><text x="1075" y="730" font-size="18" fill="#202823">연구 근거를 확인하는 보조 화면에 적합합니다.</text><text x="1075" y="764" font-size="18" fill="#202823">역할 조합과 중복 응답을 확인하기 쉽습니다.</text><text x="1075" y="798" font-size="18" fill="#202823">상향 이동을 발전으로 읽을 위험이 있습니다.</text><path d="M55 865H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="915" font-size="25" fill="#202823">RECOMMENDED COMBINATION / 쌍 모듈 → 협업 프레임 확대 → 매트릭스 대조</text><text x="55" y="958" font-size="18" fill="#65716A">세 후보는 서로 다른 이론이 아니라 동일 자료를 읽는 표시 방식입니다. 현재 앱과 논문의 매트릭스 정의는 보존해 검토합니다.</text><text x="55" y="1012" font-size="17" fill="#65716A">이 보드는 앱 소스의 응답을 재표현한 것입니다. 원 인터뷰 기록과의 대조 및 역할 범주의 최종 정의는 아직 확인하지 못했습니다.</text></g></svg>