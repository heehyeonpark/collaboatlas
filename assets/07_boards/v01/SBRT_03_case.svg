width="1.6"/><text x="895" y="300" font-size="23" fill="#202823">03 / EVALUATE</text><circle cx="1370" cy="222" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M1322 222H1418 M1370 174V270" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><rect x="1344" y="196" width="52" height="52" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><rect x="1352" y="204" width="36" height="36" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1360 222l8 8 16 -20" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><text x="1270" y="300" font-size="23" fill="#202823">04 / DELIVER</text><text x="55" y="312" font-size="20" fill="#B9472D">ACTUAL</text><text x="55" y="339" font-size="17" fill="#65716A">실제 응답</text><g id="actual-stage-1"><rect x="113" y="365" width="264" height="153" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><rect x="144" y="399" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="157" y="437" font-size="21" fill="#202823">As</text><circle cx="315" cy="430" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="297" y="437" font-size="21" fill="#202823">V</text><path d="M206 430H284" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="134" y="492" font-size="16" fill="#202823">AI / As  |  DESIGNER / V</text><text x="120" y="350" font-size="15" fill="#65716A">A-P1</text></g><path d="M377 430H488" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><path d="M480 426l8 4 -8 4" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><g id="actual-stage-2"><rect x="488" y="365" width="264" height="153" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><rect x="519" y="399" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="532" y="437" font-size="21" fill="#202823">As</text><circle cx="690" cy="430" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="672" y="437" font-size="21" fill="#202823">O</text><path d="M581 430H659" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="509" y="492" font-size="16" fill="#202823">AI / As  |  DESIGNER / O</text><text x="495" y="350" font-size="15" fill="#65716A">A-P1</text></g><path d="M752 430H863" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><path d="M855 426l8 4 -8 4" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><g id="actual-stage-3"><rect x="863" y="365" width="264" height="153" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><rect x="894" y="399" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="907" y="437" font-size="21" fill="#202823">Ge</text><circle cx="1065" cy="430" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="1047" y="437" font-size="21" fill="#202823">V</text><path d="M956 430H1034" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="884" y="492" font-size="16" fill="#202823">AI / Ge  |  DESIGNER / V</text><text x="870" y="350" font-size="15" fill="#65716A">A-P1</text></g><path d="M1127 430H1238" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><path d="M1230 426l8 4 -8 4" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><g id="actual-stage-4"><rect x="1238" y="365" width="264" height="153" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><rect x="1269" y="399" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="1282" y="437" font-size="21" fill="#202823">Ad</text><circle cx="1440" cy="430" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="1422" y="437" font-size="21" fill="#202823">O</text><path d="M1331 430H1409" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="1259" y="492" font-size="16" fill="#202823">AI / Ad  |  DESIGNER / O</text><text x="1245" y="350" font-size="15" fill="#65716A">A-P1</text></g><text x="55" y="572" font-size="20" fill="#B9472D">IDEAL</text><text x="55" y="599" font-size="17" fill="#65716A">이상 응답</text><g id="ideal-stage-1"><rect x="113" y="625" width="264" height="153" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><rect x="144" y="659" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="157" y="697" font-size="21" fill="#202823">As</text><circle cx="315" cy="690" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="297" y="697" font-size="21" fill="#202823">V</text><path d="M206 690H284" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="134" y="752" font-size="16" fill="#202823">AI / As  |  DESIGNER / V</text><text x="120" y="610" font-size="15" fill="#65716A">A-P1</text></g><path d="M377 690H488" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><path d="M480 686l8 4 -8 4" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><g id="ideal-stage-2"><rect x="488" y="625" width="264" height="153" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><rect x="519" y="659" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="532" y="697" font-size="21" fill="#202823">As</text><circle cx="690" cy="690" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="672" y="697" font-size="21" fill="#202823">I</text><path d="M581 690H659" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="509" y="752" font-size="16" fill="#202823">AI / As  |  DESIGNER / I</text><text x="495" y="610" font-size="15" fill="#65716A">A-P1</text></g><path d="M752 690H863" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><path d="M855 686l8 4 -8 4" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><g id="ideal-stage-3"><rect x="863" y="625" width="264" height="153" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><rect x="894" y="659" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="907" y="697" font-size="21" fill="#202823">Ad</text><circle cx="1065" cy="690" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="1047" y="697" font-size="21" fill="#202823">I</text><path d="M956 690H1034" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="884" y="752" font-size="16" fill="#202823">AI / Ad  |  DESIGNER / I</text><text x="870" y="610" font-size="15" fill="#65716A">A-P1</text></g><path d="M1127 690H1238" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><path d="M1230 686l8 4 -8 4" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><g id="ideal-stage-4"><rect x="1238" y="625" width="264" height="153" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><rect x="1269" y="659" width="62" height="62" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="1282" y="697" font-size="21" fill="#202823">As</text><circle cx="1440" cy="690" r="31" stroke="#202823" fill="none" stroke-width="1.6"/><text x="1422" y="697" font-size="21" fill="#202823">E</text><path d="M1331 690H1409" fill="none" stroke="#B9472D" stroke-width="1.6" stroke-dasharray=""/><text x="1259" y="752" font-size="16" fill="#202823">AI / As  |  DESIGNER / E</text><text x="1245" y="610" font-size="15" fill="#65716A">A-P1</text></g><text x="55" y="832" font-size="23" fill="#202823">READ THE DIFFERENCE / Define은 동일하고, 나머지 세 단계는 역할 쌍이 다릅니다.</text><text x="55" y="870" font-size="18" fill="#65716A">Actual → Ideal은 희망하는 차이입니다. 개선 효과, 이동 거리, 협업 수준의 상승을 나타내지 않습니다.</text><path d="M55 908H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="951" font-size="21" fill="#202823">MODEL PRINCIPLE / 연구의 개념적 전제 — 응답 자료와 별도 표시</text><path d="M245 1012H1370" fill="none" stroke="#202823" stroke-width="2" stroke-dasharray=""/><circle cx="245" cy="1012" r="7" stroke="#202823" fill="#FAFAF6" stroke-width="1.6"/><text x="145" y="1058" font-size="19" fill="#202823">방향을 판단한다</text><circle cx="620" cy="1012" r="7" stroke="#202823" fill="#FAFAF6" stroke-width="1.6"/><text x="520" y="1058" font-size="19" fill="#202823">대안을 판단한다</text><circle cx="995" cy="1012" r="7" stroke="#202823" fill="#FAFAF6" stroke-width="1.6"/><text x="895" y="1058" font-size="19" fill="#202823">수정 여부를 판단한다</text><circle cx="1370" cy="1012" r="7" stroke="#202823" fill="#FAFAF6" stroke-width="1.6"/><text x="1270" y="1058" font-size="19" fill="#202823">결과를 책임진다</text><text x="55" y="1122" font-size="17" fill="#65716A">디자이너의 판단과 책임이 이어진다는 개념을 표시합니다. A-P1의 발언이나 단계별 중요도 측정값이 아닙니다.</text><text x="55" y="1163" font-size="16" fill="#65716A">연결선 = 같은 참여자의 단계별 응답 연결 / 연속 관찰된 작업 로그가 아님 / 간격과 길이 = 레이아웃 규격</text></g></svg>