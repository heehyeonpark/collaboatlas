<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330"><title>SBRT visual grammar study</title><rect width="1600" height="1330" fill="#FAFAF6"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="55" y="40" font-size="15" fill="#65716A">SBRT / VISUAL LANGUAGE STUDY V0.2 / 01</text><text x="55" y="92" font-size="38" fill="#202823">Recognizable actors. Shared frames.</text><text x="55" y="125" font-size="17" fill="#65716A">주체는 알아보기 쉽게, 협업은 하나의 프레임으로 / GRAPHIC PROPOSAL — 개념 설명용 시안</text><path d="M55 150H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="203" font-size="23" fill="#202823">01 / ACTOR CONSTRUCTION</text><text x="55" y="237" font-size="18" fill="#65716A">사람과 모니터의 최소 단서를 더하고, 내부 역할은 교체합니다.</text><rect x="116" y="303" width="60" height="49" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M176 303l12 -9 v49 l-12 9 M116 303l12 -9 h60 M146 352v16 M128 368h37" fill="none" stroke="#202823" stroke-width="2" stroke-dasharray=""/><text x="129" y="333" font-size="18" fill="#202823">As</text><circle cx="490" cy="325" r="28" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M481 352v13 M499 352v13 M481 365q-32 0 -36 18 h90 q-4 -18 -36 -18" fill="none" stroke="#202823" stroke-width="2" stroke-dasharray=""/><text x="476" y="332" font-size="18" fill="#202823">I</text><text x="230" y="319" font-size="24" fill="#202823">AI / 인공지능</text><text x="230" y="352" font-size="17" fill="#65716A">측면 + 깊이 + 받침</text><text x="565" y="319" font-size="24" fill="#202823">DESIGNER / 디자이너</text><text x="565" y="352" font-size="17" fill="#65716A">머리 + 목 + 어깨</text><text x="1000" y="305" font-size="23" fill="#202823">IDENTITY STAYS</text><text x="1000" y="340" font-size="19" fill="#202823">외곽 = 주체 / 내부 = 역할</text><text x="1000" y="374" font-size="17" fill="#65716A">크기와 깊이 = 중요도 수치 아님</text><path d="M55 425H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="474" font-size="23" fill="#202823">02 / COLOR AS FIELD IDENTITY</text><text x="55" y="511" font-size="18" fill="#65716A">동일한 예시 역할 As + I로 색과 형태만 비교합니다. 분야별 추천 조합을 뜻하지 않습니다.</text><g id="field-filled-A"><rect x="55" y="550" width="330" height="240" rx="0" fill="#B9472D" stroke="#B9472D" stroke-width="1.5"/><text x="73" y="580" font-size="19" fill="#FAFAF6">A / DEFINE</text><path d="M73 597H367" fill="none" stroke="#FAFAF6" stroke-width="1" stroke-dasharray=""/><rect x="111" y="633" width="60" height="49" rx="0" fill="none" stroke="#FAFAF6" stroke-width="1.5"/><path d="M171 633l12 -9 v49 l-12 9 M111 633l12 -9 h60 M141 682v16 M123 698h37" fill="none" stroke="#FAFAF6" stroke-width="2" stroke-dasharray=""/><text x="124" y="663" font-size="18" fill="#FAFAF6">As</text><circle cx="295" cy="655" r="28" stroke="#FAFAF6" fill="none" stroke-width="1.6"/><path d="M286 682v13 M304 682v13 M286 695q-32 0 -36 18 h90 q-4 -18 -36 -18" fill="none" stroke="#FAFAF6" stroke-width="2" stroke-dasharray=""/><text x="281" y="662" font-size="18" fill="#FAFAF6">I</text><path d="M183 655H267" fill="none" stroke="#FAFAF6" stroke-width="1.8" stroke-dasharray=""/><text x="95" y="743" font-size="15" fill="#FAFAF6">AI</text><text x="258" y="743" font-size="15" fill="#FAFAF6">DESIGNER</text></g><text x="55" y="822" font-size="21" fill="#202823">기호와 의미</text><g id="field-filled-B"><rect x="435" y="550" width="330" height="240" rx="0" fill="#286B9A" stroke="#286B9A" stroke-width="1.5"/><text x="453" y="580" font-size="19" fill="#FAFAF6">B / DEFINE</text><path d="M453 597H747" fill="none" stroke="#FAFAF6" stroke-width="1" stroke-dasharray=""/><rect x="491" y="633" width="60" height="49" rx="0" fill="none" stroke="#FAFAF6" stroke-width="1.5"/><path d="M551 633l12 -9 v49 l-12 9 M491 633l12 -9 h60 M521 682v16 M503 698h37" fill="none" stroke="#FAFAF6" stroke-width="2" stroke-dasharray=""/><text x="504" y="663" font-size="18" fill="#FAFAF6">As</text><circle cx="675" cy="655" r="28" stroke="#FAFAF6" fill="none" stroke-width="1.6"/><path d="M666 682v13 M684 682v13 M666 695q-32 0 -36 18 h90 q-4 -18 -36 -18" fill="none" stroke="#FAFAF6" stroke-width="2" stroke-dasharray=""/><text x="661" y="662" font-size="18" fill="#FAFAF6">I</text><path d="M563 655H647" fill="none" stroke="#FAFAF6" stroke-width="1.8" stroke-dasharray=""/><text x="475" y="743" font-size="15" fill="#FAFAF6">AI</text><text x="638" y="743" font-size="15" fill="#FAFAF6">DESIGNER</text></g><text x="435" y="822" font-size="21" fill="#202823">사물과 물성</text><g id="field-filled-C"><rect x="815" y="550" width="330" height="240" rx="0" fill="#34735C" stroke="#34735C" stroke-width="1.5"/><text x="833" y="580" font-size="19" fill="#FAFAF6">C / DEFINE</text><path d="M833 597H1127" fill="none" stroke="#FAFAF6" stroke-width="1" stroke-dasharray=""/><rect x="871" y="633" width="60" height="49" rx="0" fill="none" stroke="#FAFAF6" stroke-width="1.5"/><path d="M931 633l12 -9 v49 l-12 9 M871 633l12 -9 h60 M901 682v16 M883 698h37" fill="none" stroke="#FAFAF6" stroke-width="2" stroke-dasharray=""/><text x="884" y="663" font-size="18" fill="#FAFAF6">As</text><circle cx="1055" cy="655" r="28" stroke="#FAFAF6" fill="none" stroke-width="1.6"/><path d="M1046 682v13 M1064 682v13 M1046 695q-32 0 -36 18 h90 q-4 -18 -36 -18" fill="none" stroke="#FAFAF6" stroke-width="2" stroke-dasharray=""/><text x="1041" y="662" font-size="18" fill="#FAFAF6">I</text><path d="M943 655H1027" fill="none" stroke="#FAFAF6" stroke-width="1.8" stroke-dasharray=""/><text x="855" y="743" font-size="15" fill="#FAFAF6">AI</text><text x="1018" y="743" font-size="15" fill="#FAFAF6">DESIGNER</text></g><text x="815" y="822" font-size="21" fill="#202823">행동과 상호작용</text><g id="field-filled-D"><rect x="1195" y="550" width="330" height="240" rx="0" fill="#77568D" stroke="#77568D" stroke-width="1.5"/><text x="1213" y="580" font-size="19" fill="#FAFAF6">D / DEFINE</text><path d="M1213 597H1507" fill="none" stroke="#FAFAF6" stroke-width="1" stroke-dasharray=""/><rect x="1251" y="633" width="60" height="49" rx="0" fill="none" stroke="#FAFAF6" stroke-width="1.5"/><path d="M1311 633l12 -9 v49 l-12 9 M1251 633l12 -9 h60 M1281 682v16 M1263 698h37" fill="none" stroke="#FAFAF6" stroke-width="2" stroke-dasharray=""/><text x="1264" y="663" font-size="18" fill="#FAFAF6">As</text><circle cx="1435" cy="655" r="28" stroke="#FAFAF6" fill="none" stroke-width="1.6"/><path d="M1426 682v13 M1444 682v13 M1426 695q-32 0 -36 18 h90 q-4 -18 -36 -18" fill="none" stroke="#FAFAF6" stroke-width="2" stroke-dasharray=""/><text x="1421" y="662" font-size="18" fill="#FAFAF6">I</text><path d="M1323 655H1407" fill="none" stroke="#FAFAF6" stroke-width="1.8" stroke-dasharray=""/><text x="1235" y="743" font-size="15" fill="#FAFAF6">AI</text><text x="1398" y="743" font-size="15" fill="#FAFAF6">DESIGNER</text></g><text x="1195" y="822" font-size="21" fill="#202823">시스템과 서비스</text><path d="M55 863H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="912" font-size="23" fill="#202823">03 / ONE MODULE, THREE INFORMATION LAYERS</text><rect x="55" y="953" width="330" height="240" rx="0" fill="#FAFAF6" stroke="#B9472D" stroke-width="1.5"/><text x="73" y="983" font-size="19" fill="#B9472D">A / IDEATE</text><path d="M73 1000H367" fill="none" stroke="#B9472D" stroke-width="1" stroke-dasharray=""/><rect x="111" y="1036" width="60" height="49" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><path d="M171 1036l12 -9 v49 l-12 9 M111 1036l12 -9 h60 M141 1085v16 M123 1101h37" fill="none" stroke="#B9472D" stroke-width="2" stroke-dasharray=""/><text x="124" y="1066" font-size="18" fill="#B9472D">Ge</text><circle cx="295" cy="1058" r="28" stroke="#B9472D" fill="none" stroke-width="1.6"/><path d="M286 1085v13 M304 1085v13 M286 1098q-32 0 -36 18 h90 q-4 -18 -36 -18" fill="none" stroke="#B9472D" stroke-width="2" stroke-dasharray=""/><text x="281" y="1065" font-size="18" fill="#B9472D">I</text><path d="M183 1058H267" fill="none" stroke="#B9472D" stroke-width="1.8" stroke-dasharray=""/><text x="95" y="1146" font-size="15" fill="#B9472D">AI</text><text x="258" y="1146" font-size="15" fill="#B9472D">DESIGNER</text><text x="470" y="983" font-size="25" fill="#202823">GUIDE</text><text x="680" y="983" font-size="22" fill="#202823">협업 안내</text><text x="680" y="1016" font-size="18" fill="#65716A">손 빠른 팀원 / 무엇을 요청할지 / 내가 판단할 것</text><text x="470" y="1073" font-size="25" fill="#202823">EVIDENCE</text><text x="680" y="1073" font-size="22" fill="#202823">연구 근거</text><text x="680" y="1106" font-size="18" fill="#65716A">설문과 인터뷰를 구분 / 표본과 출처 / 해석 범위</text><text x="470" y="1163" font-size="25" fill="#202823">LOG</text><text x="680" y="1163" font-size="22" fill="#202823">나의 기록</text><text x="680" y="1196" font-size="18" fill="#65716A">요청 → 생성 결과 → 나의 수정과 판단 → 반영본</text><text x="55" y="1237" font-size="17" fill="#65716A">왼쪽 모듈은 아이데이션 안내를 설명하는 작성 예시입니다. 검증된 최적 조합이 아닙니다.</text><text x="55" y="1285" font-size="18" fill="#202823">앱: 모듈을 열어 안내와 기록 확인 / 포스터: 같은 모듈 옆에 범례, 근거, 설명을 펼쳐 배치</text></g></svg>