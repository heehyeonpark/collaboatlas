<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2030" viewBox="0 0 1600 2030"><title>SBRT visual grammar study</title><rect width="1600" height="2030" fill="#FAFAF6"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="55" y="40" font-size="15" fill="#65716A">SBRT / VISUAL LANGUAGE STUDY V0.2 / 02</text><text x="55" y="92" font-size="38" fill="#202823">SBRT / A map for designing with AI</text><text x="55" y="125" font-size="17" fill="#65716A">앱과 전시 포스터가 공유하는 정보 구조 / 전체 지도 구성 시안 — 데이터 도판 완성본 아님</text><path d="M55 150H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="200" font-size="30" fill="#202823">I / UNDERSTAND THE MODEL</text><text x="55" y="236" font-size="21" fill="#65716A">연구 이해: 왜 이 구조가 필요한가</text><rect x="55" y="265" width="470" height="167" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="75" y="302" font-size="23" fill="#202823">FOUR STAGES</text><text x="75" y="335" font-size="19" fill="#202823">디자인 활동의 공통 구조</text><text x="75" y="373" font-size="17" fill="#65716A">방법론의 활동을 네 단계로 대응</text><text x="75" y="402" font-size="17" fill="#65716A">원 방법론의 순환과 차이도 유지</text><rect x="565" y="265" width="470" height="167" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="585" y="302" font-size="23" fill="#202823">FOUR AXES</text><text x="585" y="335" font-size="19" fill="#202823">디자인 문제의 범위</text><text x="585" y="373" font-size="17" fill="#65716A">Buchanan + KIDP 분류의 통합</text><text x="585" y="402" font-size="17" fill="#65716A">A–D의 정의, 특징, 포함 분야</text><rect x="1075" y="265" width="470" height="167" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="1095" y="302" font-size="23" fill="#202823">WHY COLLABORATE</text><text x="1095" y="335" font-size="19" fill="#202823">협업과 전환의 필요</text><text x="1095" y="373" font-size="17" fill="#65716A">AI 기여와 디자이너 판단을 연결</text><text x="1095" y="402" font-size="17" fill="#65716A">단계별 목적에 맞게 역할 재설정</text><rect x="55" y="457" width="1490" height="135" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="78" y="494" font-size="26" fill="#202823">SBRT / STAGE-BASED ROLE TRANSITION</text><text x="78" y="531" font-size="20" fill="#202823">분야와 단계의 맥락에 따라 AI와 디자이너의 역할을 조정하고 다음 단계의 작업을 구체화하는 모델</text><text x="78" y="565" font-size="17" fill="#65716A">HYPOTHESIS / 무방향 반복과 다음 단계 진입의 어려움을 줄이는 것을 지향 — 정체 예방 효과는 검증 결과와 구분</text><path d="M55 625H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="674" font-size="30" fill="#202823">II / EXPLORE COLLABORATION</text><text x="55" y="710" font-size="21" fill="#65716A">분야별 협업 제안: 근거를 읽고, 역할을 선택하고, 요청 방식으로 연결</text><circle cx="245" cy="787" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M197 787H293 M245 739V835" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><circle cx="245" cy="787" r="25" stroke="#202823" fill="none" stroke-width="1.6"/><circle cx="245" cy="787" r="8" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M211 753L279 821 M211 821L279 753" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="227" cy="769" r="3" stroke="#202823" fill="#202823" stroke-width="1.6"/><text x="145" y="865" font-size="23" fill="#202823">01 / DEFINE</text><circle cx="620" cy="787" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M572 787H668 M620 739V835" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><path d="M620 787L652.0 787.0" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="652.0" cy="787.0" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M620 787L644.5134221798073 807.5692035099693" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="644.5134221798073" cy="807.5692035099693" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M620 787L625.5567416853418 818.5138480963907" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="625.5567416853418" cy="818.5138480963907" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M620 787L604.0 814.712812921102" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="604.0" cy="814.712812921102" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M620 787L589.9298361348509 797.9446445864214" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="589.9298361348509" cy="797.9446445864214" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M620 787L589.9298361348509 776.0553554135786" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="589.9298361348509" cy="776.0553554135786" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M620 787L604.0 759.287187078898" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="604.0" cy="759.287187078898" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M620 787L625.5567416853418 755.4861519036093" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="625.5567416853418" cy="755.4861519036093" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><path d="M620 787L644.5134221798073 766.4307964900307" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="644.5134221798073" cy="766.4307964900307" r="3" stroke="#202823" fill="none" stroke-width="1.6"/><circle cx="620" cy="787" r="9" stroke="#202823" fill="#202823" stroke-width="1.6"/><text x="520" y="865" font-size="23" fill="#202823">02 / IDEATE</text><circle cx="995" cy="787" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M947 787H1043 M995 739V835" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><path d="M995 757L1025 787 995 817 965 787Z M972 780H1018 M972 794H1018 M995 757V817" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><circle cx="995" cy="787" r="9" stroke="#202823" fill="none" stroke-width="1.6"/><text x="895" y="865" font-size="23" fill="#202823">03 / EVALUATE</text><circle cx="1370" cy="787" r="40" stroke="#C9D0C8" fill="none" stroke-width="1.6"/><path d="M1322 787H1418 M1370 739V835" fill="none" stroke="#C9D0C8" stroke-width="1" stroke-dasharray="2 5"/><rect x="1344" y="761" width="52" height="52" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><rect x="1352" y="769" width="36" height="36" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><path d="M1360 787l8 8 16 -20" fill="none" stroke="#202823" stroke-width="1.6" stroke-dasharray=""/><text x="1270" y="865" font-size="23" fill="#202823">04 / DELIVER</text><rect x="55" y="900" width="1490" height="86" rx="0" fill="none" stroke="#B9472D" stroke-width="1.5"/><rect x="55" y="900" width="160" height="86" rx="0" fill="#B9472D" stroke="#B9472D" stroke-width="1.5"/><text x="75" y="935" font-size="24" fill="#FAFAF6">FIELD A</text><text x="75" y="964" font-size="15" fill="#FAFAF6">기호와 의미</text><text x="230" y="934" font-size="17" fill="#B9472D">ROLE PAIR</text><text x="230" y="964" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="580" y="934" font-size="17" fill="#B9472D">ROLE PAIR</text><text x="580" y="964" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="955" y="934" font-size="17" fill="#B9472D">ROLE PAIR</text><text x="955" y="964" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="1330" y="934" font-size="17" fill="#B9472D">ROLE PAIR</text><text x="1330" y="964" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><rect x="55" y="1004" width="1490" height="86" rx="0" fill="none" stroke="#286B9A" stroke-width="1.5"/><rect x="55" y="1004" width="160" height="86" rx="0" fill="#286B9A" stroke="#286B9A" stroke-width="1.5"/><text x="75" y="1039" font-size="24" fill="#FAFAF6">FIELD B</text><text x="75" y="1068" font-size="15" fill="#FAFAF6">사물과 물성</text><text x="230" y="1038" font-size="17" fill="#286B9A">ROLE PAIR</text><text x="230" y="1068" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="580" y="1038" font-size="17" fill="#286B9A">ROLE PAIR</text><text x="580" y="1068" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="955" y="1038" font-size="17" fill="#286B9A">ROLE PAIR</text><text x="955" y="1068" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="1330" y="1038" font-size="17" fill="#286B9A">ROLE PAIR</text><text x="1330" y="1068" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><rect x="55" y="1108" width="1490" height="86" rx="0" fill="none" stroke="#34735C" stroke-width="1.5"/><rect x="55" y="1108" width="160" height="86" rx="0" fill="#34735C" stroke="#34735C" stroke-width="1.5"/><text x="75" y="1143" font-size="24" fill="#FAFAF6">FIELD C</text><text x="75" y="1172" font-size="15" fill="#FAFAF6">행동과 상호작용</text><text x="230" y="1142" font-size="17" fill="#34735C">ROLE PAIR</text><text x="230" y="1172" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="580" y="1142" font-size="17" fill="#34735C">ROLE PAIR</text><text x="580" y="1172" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="955" y="1142" font-size="17" fill="#34735C">ROLE PAIR</text><text x="955" y="1172" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="1330" y="1142" font-size="17" fill="#34735C">ROLE PAIR</text><text x="1330" y="1172" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><rect x="55" y="1212" width="1490" height="86" rx="0" fill="none" stroke="#77568D" stroke-width="1.5"/><rect x="55" y="1212" width="160" height="86" rx="0" fill="#77568D" stroke="#77568D" stroke-width="1.5"/><text x="75" y="1247" font-size="24" fill="#FAFAF6">FIELD D</text><text x="75" y="1276" font-size="15" fill="#FAFAF6">시스템과 서비스</text><text x="230" y="1246" font-size="17" fill="#77568D">ROLE PAIR</text><text x="230" y="1276" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="580" y="1246" font-size="17" fill="#77568D">ROLE PAIR</text><text x="580" y="1276" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="955" y="1246" font-size="17" fill="#77568D">ROLE PAIR</text><text x="955" y="1276" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="1330" y="1246" font-size="17" fill="#77568D">ROLE PAIR</text><text x="1330" y="1276" font-size="16" fill="#65716A">메타포 / 요청 / 판단</text><text x="55" y="1352" font-size="17" fill="#65716A">위 16개 위치는 분야 × 단계 안내 모듈의 자리입니다. 역할 쌍은 최신 분석과 연구자 검토 후 채웁니다.</text><rect x="55" y="1380" width="725" height="146" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="76" y="1417" font-size="23" fill="#202823">SURVEY / n=43</text><text x="76" y="1452" font-size="18" fill="#202823">역할별 선택 경향과 자율성 / 분야별 표본·분포 필요</text><text x="76" y="1490" font-size="17" fill="#65716A">개별 최다 역할 ≠ 공동 조합의 최다 선택</text><rect x="805" y="1380" width="740" height="146" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="826" y="1417" font-size="23" fill="#202823">INTERVIEWS / n=12</text><text x="826" y="1452" font-size="18" fill="#202823">분야별 3명 / 실제와 이상 / 연결된 응답 경로</text><text x="826" y="1490" font-size="17" fill="#65716A">가는 선 = 개인 / 띠의 폭 = 동일 경로 인원수</text><path d="M55 1560H1545" fill="none" stroke="#C9D0C8" stroke-width="1.6" stroke-dasharray=""/><text x="55" y="1607" font-size="30" fill="#202823">III / RECORD YOUR PROCESS</text><text x="55" y="1644" font-size="21" fill="#65716A">나의 협업 기록: 작업 옆에서 남기고, 나중에 설명 자료로 사용</text><rect x="55" y="1675" width="350" height="136" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="75" y="1713" font-size="23" fill="#202823">REQUEST</text><text x="75" y="1747" font-size="19" fill="#202823">맡긴 일과 요청문</text><text x="75" y="1784" font-size="16" fill="#65716A">TEXT + IMAGE / 선택 첨부</text><rect x="435" y="1675" width="350" height="136" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="455" y="1713" font-size="23" fill="#202823">OUTPUT</text><text x="455" y="1747" font-size="19" fill="#202823">AI가 만든 글과 이미지</text><text x="455" y="1784" font-size="16" fill="#65716A">TEXT + IMAGE / 선택 첨부</text><rect x="815" y="1675" width="350" height="136" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="835" y="1713" font-size="23" fill="#202823">JUDGMENT</text><text x="835" y="1747" font-size="19" fill="#202823">선택·수정과 그 이유</text><text x="835" y="1784" font-size="16" fill="#65716A">TEXT + IMAGE / 선택 첨부</text><rect x="1195" y="1675" width="350" height="136" rx="0" fill="none" stroke="#C9D0C8" stroke-width="1.5"/><text x="1215" y="1713" font-size="23" fill="#202823">FINAL USE</text><text x="1215" y="1747" font-size="19" fill="#202823">최종 반영 내용</text><text x="1215" y="1784" font-size="16" fill="#65716A">TEXT + IMAGE / 선택 첨부</text><rect x="55" y="1842" width="1490" height="91" rx="0" fill="none" stroke="#202823" stroke-width="1.5"/><text x="76" y="1881" font-size="25" fill="#202823">EXPORT / AI 활용 요약서 + 협업 과정 상세 기록</text><text x="76" y="1913" font-size="17" fill="#65716A">앱은 입력·편집·저장 / 포스터는 공개 가능한 사례로 기록 방법을 설명 / 최종 파일 형식은 구현 단계에서 확정</text><text x="55" y="1983" font-size="18" fill="#202823">READING KEY / 연구 근거 · 모델 해석 · 협업 제안 · 개인 기록을 구분하고, 같은 그래픽 문법으로 연결합니다.</text></g></svg>